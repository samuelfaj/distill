name: Release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: macos-aarch64
            binary: distill
            asset_ext: ''
          - runner: macos-15-intel
            platform: macos-x86_64
            binary: distill
            asset_ext: ''
          - runner: ubuntu-22.04
            platform: linux-x86_64
            binary: distill
            asset_ext: ''
          - runner: ubuntu-22.04-arm
            platform: linux-aarch64
            binary: distill
            asset_ext: ''
          - runner: windows-latest
            platform: windows-x86_64
            binary: distill.exe
            asset_ext: '.exe'
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_RELEASE_DEBUG: 0
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C force-unwind-tables=yes'
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config cmake clang libssl-dev libasound2-dev libdbus-1-dev
      - name: Install pinned Protocol Buffers compiler (Linux)
        if: runner.os == 'Linux'
        env:
          DISTILL_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          spec = json.loads(pathlib.Path('bin/protoc').read_text().split('\n', 1)[1])['platforms'][os.environ['DISTILL_PLATFORM']]
          data = urllib.request.urlopen(spec['providers'][0]['url']).read()
          assert hashlib.sha256(data).hexdigest() == spec['digest'], 'protoc checksum mismatch'
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'protoc'
          zipfile.ZipFile(io.BytesIO(data)).extractall(root)
          protoc = root / 'bin/protoc'
          protoc.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'PROTOC={protoc}\n')
          PYCODE
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc -y --no-progress
      - name: Validate install.ps1 syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors; exit 1 }
      - name: Test release installer
        if: runner.os != 'Windows'
        run: python3 tests/test_release_installer.py
      - name: Install Rust
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build and verify version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/codegen/distill-version/Cargo.toml)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          GROK_VERSION="$version" cargo build --locked --release -p distill-pager-bin --bin distill
          "target/release/${{ matrix.binary }}" --version | grep -F "$version"
          mkdir -p artifacts
          cp "target/release/${{ matrix.binary }}" "artifacts/distill-${{ matrix.platform }}${{ matrix.asset_ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: distill-${{ matrix.platform }}
          path: artifacts/*
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh install.ps1 LICENSE NOTICE THIRD-PARTY-NOTICES artifacts/
          cd artifacts
          sha256sum distill-* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* --verify-tag --title "Distill $GITHUB_REF_NAME" --generate-notes
