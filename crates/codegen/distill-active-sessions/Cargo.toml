# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-active-sessions"
version = "0.1.0"
edition.workspace = true
description = "Crash-recovery registry of open TUI sessions, stored as a lock-guarded JSON file under the grok home"

[dependencies]
# `SessionId`, the key each registry entry is filed under.
agent-client-protocol = { workspace = true }
# `opened_at` timestamps.
chrono = { workspace = true, features = ["serde"] }
# Advisory file lock around the read-modify-write of the registry file.
fs2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
# `distill_home()` supplies the directory the registry file lives in.
distill-config = { workspace = true }

# `kill(pid, 0)` liveness probe for the crash scan.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `OpenProcess` liveness probe for the crash scan.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
