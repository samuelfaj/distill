# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-bundle"
version = "0.1.0"
edition.workspace = true
description = "Checksum-tracked on-disk cache for the published subagent bundle (personas, roles, agents, skills)"

[features]
# Exposes the archive/manifest fixtures (`test_helpers`) to downstream crates'
# test targets. Inside distill-shell these were plain `#[cfg(test)]` helpers
# shared across modules; across the crate boundary they need a feature.
test-support = []
# CI default set (preferred over cargo `default` for hermetic CI builds): the
# library is compiled with the test-support surface so dependent Bazel test
# targets can reach `test_helpers`.
default-bazel = ["test-support"]

[dependencies]
anyhow = { workspace = true }
# Gzip layer of the bundle archive.
flate2 = { workspace = true }
# `SubagentBundle` is the wire shape the proxy serves; the cache writes it out.
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
serde = { workspace = true }
serde_json = { workspace = true }
# Manifest checksums are SHA-256 over file bytes.
sha2 = { workspace = true }
tar = { workspace = true }
# `distill_home()` supplies the parent of the `bundled` cache directory.
distill-config = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
