# Modified for Distill by Samuel Fajreldines, 2026.
[package]
name = "distill-gboom"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "The /gboom easter-egg raycaster game for the grok CLI pager"

[dependencies]
crossterm = { workspace = true }
image = { workspace = true, features = ["png"] }

[features]
# Exposes test-only helpers (e.g. `GboomState::any_movement_held`) to
# downstream crates' test builds. Enabled by `distill-pager`'s
test-support = []
# CI builds a single shared rlib variant per crate; keep the test-only
# helpers present for the pager's CI test target (see distill-pager-render
# for the full rationale). The helpers are inert unless called.
default-bazel = ["test-support"]

[lints]
workspace = true
