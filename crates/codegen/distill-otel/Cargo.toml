# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-otel"
version = "0.1.0"
edition.workspace = true
description = "OpenTelemetry foundation for Distill: W3C trace-context propagation, the OTLP HTTP client, and the tracing->OTLP span layer/provider"
authors = ["Samuel Fajreldines"]

[features]
default-bazel = []

[dependencies]
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-http = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
distill-auth = { workspace = true }
distill-extra-ca = { workspace = true }
distill-env = { workspace = true, optional = true }
distill-secrets = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = ["testing"] }
rcgen = { workspace = true }
rustls = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
