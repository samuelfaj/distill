# Modified for Distill by Samuel Fajreldines, 2026.
[package]
name = "distill-pager-pty-harness"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
authors = ["Samuel Fajreldines"]
description = "Shared PTY harness + scenario library for distill-pager e2e tests and benchmarks."
publish = false

# Not imported into the production pager binary. Spawn-only pager tests live
# here so `cargo test -p distill-pager` / `cargo test -p distill-pager-bin`
# never compile this crate, and the spawn tests never link the pager library.

[dependencies]
# Headless PTY controller with alacritty_terminal-based terminal emulation,
# vim key notation parser, styled/HTML output, and HTTP server.
dunce = { workspace = true }
ptyctl = { path = "../ptyctl" }

# PTY spawning + input/output
portable-pty = { workspace = true }
# Real OS signals (libc::kill) for the SIGINT/SIGTERM/SIGHUP e2e path.
libc = { workspace = true }

# alacritty_terminal re-exports `vte` which timing.rs uses for frame marker
# detection. screen.rs uses ptyctl's Terminal (backed by alacritty_terminal)
# instead of the old vt100 dependency.
alacritty_terminal = { workspace = true }

# Shared mock inference server used to drive content into the pager
# during scenarios (content.rs wraps it).
distill-test-support = { workspace = true }

# Async runtime + common helpers shared with the pager.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "io-util",
    "io-std",
    "time",
    "net",
] }

anyhow = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
serde_yaml = { workspace = true }
image = { workspace = true, features = ["png"] }
tempfile = { workspace = true }
distill-tty-utils = { workspace = true }

clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
# Fixture helpers for the spawn tests. All of these are already in the pager
# binary's graph the tests exec, so they add no crate compiles.
git2 = { workspace = true }
serial_test = { workspace = true }
toml = { workspace = true }
unicode-width = { workspace = true }

[[test]]
name = "env_op_compile"
path = "tests/env_op_compile.rs"

# Spawn-only pager families. Each root is its own Cargo/Bazel process so CI
# can schedule them independently. Cases stay #[ignore]d for ordinary cargo.
[[test]]
name = "pty_e2e_smoke"
path = "tests/pty_e2e_smoke.rs"

[[test]]
name = "pty_e2e_queue"
path = "tests/pty_e2e_queue.rs"

[[test]]
name = "pty_e2e_scroll_selection"
path = "tests/pty_e2e_scroll_selection.rs"

[[test]]
name = "pty_e2e_minimal"
path = "tests/pty_e2e_minimal.rs"

[[test]]
name = "pty_e2e_config_ui"
path = "tests/pty_e2e_config_ui.rs"

[[test]]
name = "pty_e2e_shell_tools"
path = "tests/pty_e2e_shell_tools.rs"

[[test]]
name = "pty_e2e_persistence"
path = "tests/pty_e2e_persistence.rs"

[[test]]
name = "pty_e2e_clipboard"
path = "tests/pty_e2e_clipboard.rs"

[[test]]
name = "leader_pty_e2e"
path = "tests/leader_pty_e2e/mod.rs"

[[test]]
name = "scripted_scenarios"
path = "tests/scripted_scenarios.rs"

[[test]]
name = "pty_auto_mode"
path = "tests/pty_auto_mode.rs"
[[bin]]
name = "pty-scenario"
path = "src/bin/pty_scenario.rs"

# Fixture for tests/orphan_reap.rs: holds a PtyController child and blocks so
# the test can kill it ungracefully and assert the child does not survive.
[[bin]]
name = "pty_orphan_holder"
path = "src/bin/pty_orphan_holder.rs"

# scroll-matrix — scroll validation matrix sweep. The curated tier also runs
# in CI (tests/scroll_matrix_curated.rs); this binary is the local full-sweep
# and single-cell-rerun entry point.
[[bin]]
name = "scroll-matrix"
path = "src/bin/scroll_matrix.rs"

[[bin]]
name = "startup-tui-probe"
path = "src/bin/startup_tui_probe.rs"

# pty_bench scenario runner — produces a standalone binary the CI pipeline
# pre-compiles and executes directly against a release pager artifact.
# Lives here (not in the pager crate) so it can share the harness source
# without any path hacks.
[[bench]]
name = "pty_bench"
path = "benches/pty_bench.rs"
harness = false

# paste_latency — clipboard paste latency CLI (macOS-only at runtime: drives
# the REAL host pasteboard). Standalone so `--binary` can target old pager
# artifacts for before/after comparisons.
[[bench]]
name = "paste_latency"
path = "benches/paste_latency.rs"
harness = false
