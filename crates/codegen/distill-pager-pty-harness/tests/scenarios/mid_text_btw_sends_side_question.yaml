name: mid-text-btw-sends-side-question
description: >
  A mid-message `/btw` token sends the whole message (minus the token) as one
  side question: the overlay opens with the rewritten `/btw ...` title, the
  composer clears, and no user turn is echoed. 100 columns keep the overlay
  title from truncating before the asserted prefix.
terminal:
  rows: 40
  cols: 100
environment:
  args: ["--trust"]
mock:
  response: "BTW_SIDE_ANSWER_DONE side answer after the hoisted mid-text /btw."
steps:
  - action: wait_for_text
    text: Quit
    timeout_ms: 20000
  - action: assert_not_contains
    text: panicked
  - action: focus_prompt
  - action: type_text
    text: "explain the controller. /btw what is a WBC_SIDE_Q"
  - action: wait_for_text
    text: "WBC_SIDE_Q"
    timeout_ms: 10000
  # `/btw` needs the session id; SessionCreated puts the model name on screen with it.
  - action: wait_for_text
    text: "test-model"
    timeout_ms: 10000
  - action: keys
    keys: "<Enter>"
  # Overlay title carries the hoisted form; a verbatim echo could never contain it.
  - action: wait_for_text
    text: "/btw explain the controller."
    timeout_ms: 15000
  - action: wait_for_text
    text: BTW_SIDE_ANSWER_DONE
    timeout_ms: 30000
  # No verbatim user echo: nothing went to the main turn.
  - action: assert_not_contains
    text: "controller. /btw what"
  - action: assert_request_contains
    text: WBC_SIDE_Q
  - action: assert_not_contains
    text: panicked
  - action: assert_running
  - action: screenshot
    name: side-question-overlay
    note: "Side-question overlay titled with the hoisted /btw line; composer empty."
