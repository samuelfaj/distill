# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-session-events"
version = "0.1.0"
edition.workspace = true
description = "Typed per-session event log written as JSON lines"

[dependencies]
# RFC 3339 timestamps stamped on every event line at write time.
chrono = { workspace = true }
# Derives the tagged wire form of the event enum.
serde = { workspace = true }
# JSON-line encoding, plus the free-form cancellation-context payload.
serde_json = { workspace = true }
# `IntoStaticStr` on `ToolOutcome`, so consumers get a `&'static str` label
# matching the serde representation without a second match arm, plus
# `EnumIter` in tests to pin every variant's label.
strum = { workspace = true }
# Warn-once diagnostics when the log file cannot be opened or written.
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
