# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-status-line"
version = "0.1.0"
edition.workspace = true
description = "The status-line contract: the `[ui.status_line]` config a user writes and the payload the agent sends clients."

[dependencies]
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
# Production parses TOML; the lenient parser is built on `untagged`, whose
# behaviour is format-dependent, so it needs coverage in the real format.
toml = { workspace = true }

[features]
# Gated so a cargo release build leaves the fixture out. The Bazel library
# target enables `default-bazel`, since the tests that read it build against it.
test-support = []
default-bazel = ["test-support"]

[lints]
workspace = true
