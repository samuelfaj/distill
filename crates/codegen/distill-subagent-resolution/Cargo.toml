# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Shared subagent definition, runtime, prompt, and resume resolution"

[dependencies]
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
distill-agent = { path = "../distill-agent" }
distill-sampling-types = { path = "../distill-sampling-types" }
distill-tools = { path = "../distill-tools" }
distill-tool-types.workspace = true

[features]
default = []

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
