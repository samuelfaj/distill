# Modified for Distill by Samuel Fajreldines, 2026.
[package]
license = "Apache-2.0"
name = "distill-workspace-daemon"
version = "0.1.0"
edition.workspace = true
description = "Process lifecycle for the workspace-server daemon: self-daemonization, single-instance pidfile locking, and preview-proxy child supervision"

[dependencies]
clap = { workspace = true }
fs2 = { workspace = true }
prometheus = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
tokio = { workspace = true, features = ["macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
# Metric donation sink for the preview-proxy metrics scraper.
distill-computer-hub-sdk = { workspace = true, features = ["metrics"] }
# reset_oom_score_adj in the preview-proxy pre_exec hook.
distill-tty-utils = { workspace = true }

# fork/setsid/dup2/chdir on the self-daemonize path, and PDEATHSIG on the
# supervised preview-proxy child.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# SetStdHandle on the Windows self-daemonize path, plus the predecessor
# open/terminate calls behind the pidfile takeover.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }

[lints]
workspace = true
