<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const W = 1280, H = 720, T = 14, TAU = Math.PI * 2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd = mulberry32(1888);
const rr = (a,b)=>a+(b-a)*rnd();
const ri = (a,b)=>Math.floor(rr(a,b+1));
const pick = a=>a[Math.floor(rnd()*a.length)];
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const sstep = (a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x);};
const fract = x=>x-Math.floor(x);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1); renderer.setSize(W,H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 512;
  const g = cv.getContext('2d'); const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#5f8fc6'); gr.addColorStop(0.35,'#9dc0e2'); gr.addColorStop(0.62,'#f3d4a4'); gr.addColorStop(1,'#f0b988');
  g.fillStyle = gr; g.fillRect(0,0,4,512);
  const tx = new THREE.CanvasTexture(cv); tx.colorSpace = THREE.SRGBColorSpace; scene.background = tx;
}
scene.fog = new THREE.FogExp2(0xe9cba5, 0.0021);
const camera = new THREE.PerspectiveCamera(38, W/H, 1, 900);

const sun = new THREE.DirectionalLight(0xffc48a, 3.3);
sun.position.set(-80,58,50); sun.target.position.set(0,0,0);
sun.castShadow = true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-92,right:92,top:92,bottom:-92,near:10,far:330});
sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.1;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd4f0, 0x8a6a48, 1.25));

const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType,samples:4}));
composer.setPixelRatio(1); composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W,H), 0.7, 0.5, 1.15);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- helpers ----------
const Yv = new THREE.Vector3(0,1,0), Zv = new THREE.Vector3(0,0,1);
const QI = new THREE.Quaternion();
const _p=new THREE.Vector3(), _s=new THREE.Vector3(), _M=new THREE.Matrix4(), _c=new THREE.Color();
const _d=new THREE.Vector3(), _q=new THREE.Quaternion(), _q2=new THREE.Quaternion(), _ql=new THREE.Quaternion(), _e=new THREE.Euler();
const Cc = {}; const C = h => Cc[h] || (Cc[h] = new THREE.Color(h));
const P3 = (x,y,z)=>new THREE.Vector3(x,y,z);
const qyaw = a => new THREE.Quaternion().setFromAxisAngle(Yv,a);

// ---------- static voxel collection ----------
const SM=[], SC=[]; let AO=0;
function sb(x,y,z,sx,sy,sz,hex,q,jit=0.05){
  _p.set(x,y,z); _s.set(sx,sy,sz); _M.compose(_p,q||QI,_s);
  const e=_M.elements; for(let i=0;i<16;i++) SM.push(e[i]);
  _c.set(hex);
  let k=1+(rnd()-0.5)*2*jit;
  if(AO && y<4) k*=0.74+0.26*clamp((y+0.5)/4,0,1);
  SC.push(_c.r*k,_c.g*k,_c.b*k);
}
function beam(a,b,size,hex,jit=0.06,step=0.8){
  _d.subVectors(b,a); const L=_d.length(); if(L<1e-4) return;
  const n=Math.max(1,Math.ceil(L/(size*step)));
  const q=new THREE.Quaternion().setFromUnitVectors(Zv,_d.clone().divideScalar(L));
  for(let i=0;i<=n;i++){const t=i/n; sb(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,a.z+(b.z-a.z)*t,size,size,size,hex,q,jit);}
}
const beam6=(ax,ay,az,bx,by,bz,size,hex,jit,step)=>beam(P3(ax,ay,az),P3(bx,by,bz),size,hex,jit,step);
function voxBox(x0,y0,z0,x1,y1,z1,cell,hex,jit=0.05,hollow=true){
  const nx=Math.max(1,Math.round((x1-x0)/cell)),ny=Math.max(1,Math.round((y1-y0)/cell)),nz=Math.max(1,Math.round((z1-z0)/cell));
  const dx=(x1-x0)/nx,dy=(y1-y0)/ny,dz=(z1-z0)/nz;
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)for(let k=0;k<nz;k++){
    if(hollow&&i>0&&i<nx-1&&j>0&&j<ny-1&&k>0&&k<nz-1) continue;
    sb(x0+dx*(i+0.5),y0+dy*(j+0.5),z0+dz*(k+0.5),dx,dy,dz,hex,null,jit);
  }
}

// ---------- island layout ----------
const HW=4, BRX=22;
const zc = x => 34+3*Math.sin(0.07*x+0.6);
function inside(x,z,s,ph){
  const th=Math.atan2(z/50,x/60);
  const r=1+0.05*Math.sin(3*th+1+ph)+0.035*Math.sin(5*th+2-1.3*ph)+0.025*Math.sin(9*th+2*ph);
  return Math.hypot(x/60,z/50)<s*r;
}
function ground(x,z){
  const dz=z-zc(x);
  if(Math.abs(dz)<HW) return 'w';
  if(Math.abs(dz)<HW+1) return 'q';
  if(Math.abs(x)<31&&Math.abs(z)<20.5) return 'd';
  if(Math.abs(x)<36&&Math.abs(z)<25) return 'r';
  if(Math.abs(x-BRX)<3.5&&z>20&&z<46) return 'r';
  return 'g';
}
const waterCells=[];
function terrain(){
  const grass=['#6f9b45','#79a64c','#668f3f','#83ad55'];
  const dirt=['#a8855a','#9b7a50','#b08d62','#a07f56'];
  const road=['#a39b8c','#968e80','#aca493'];
  for(let xi=-61;xi<=60;xi++)for(let zi=-51;zi<=50;zi++){
    const x=xi+0.5,z=zi+0.5; if(!inside(x,z,1,0)) continue;
    const g=ground(x,z);
    if(g==='w'){waterCells.push([x,z]);continue;}
    if(g==='q'){sb(x,-0.2,z,1,1.6,1,'#aaa59a',null,0.06);continue;}
    let hex,sy=1;
    if(g==='d'){ hex=(Math.abs(Math.abs(z)-6)<1.1)?'#7d6143':pick(dirt); }
    else if(g==='r'){ hex=pick(road); }
    else { const n=Math.sin(x*0.31+z*0.17)+Math.sin(x*0.13-z*0.29); hex=grass[n>0.9?3:n>0?0:n>-0.9?1:2]; if(!inside(x+1.2,z,1,0)||!inside(x-1.2,z,1,0)||!inside(x,z+1.2,1,0)||!inside(x,z-1.2,1,0)) sy=rr(1,1.25); }
    sb(x,-1+sy/2,z,1,sy,1,hex,null,0.05);
  }
  const SL=['#7a5a3c','#8a6c48','#76726c','#5f5a55','#8c6a44','#6f6b66','#6b4b36','#5a544f','#4d4844','#423e3c'];
  for(let j=0;j<10;j++){
    const s=0.965-0.088*j, yc=-2-2*j, dark=1-0.03*j;
    for(let xi=-31;xi<=30;xi++)for(let zi=-26;zi<=25;zi++){
      const x=xi*2+1,z=zi*2+1; if(!inside(x,z,s,j*0.9)) continue;
      if(j>=7&&rnd()<0.2) continue;
      let hex=SL[j]; if(rnd()<0.14) hex=pick(['#9a958c','#6a5a48','#a08a68','#555049']);
      _c.set(hex); sb(x,yc,z,2,2,2,'#'+_c.clone().multiplyScalar(dark).getHexString(),null,0.1);
    }
  }
  for(let i=0;i<26;i++){
    let x,z; do{x=rr(-30,30);z=rr(-24,24);}while(!inside(x,z,0.4,8));
    let y=-21.6, sz=rr(1.6,2); const n=ri(2,4);
    for(let k=0;k<n;k++){sb(x+rr(-0.2,0.2),y-sz/2,z+rr(-0.2,0.2),sz,sz,sz,pick(['#4a4440','#554e48','#3e3a38']),null,0.1);y-=sz*0.9;sz*=0.75;}
  }
}

// ---------- bridge ----------
function bridge(){
  const z0=zc(BRX);
  for(let xi=0;xi<6;xi++){
    const x=BRX-2.5+xi, edge=(xi===0||xi===5);
    for(let zi=-9;zi<9;zi++){
      const zl=zi+0.5, az=Math.abs(zl);
      const top=az<5.5?3:az<7?2:1;
      for(let yi=0;yi<4;yi++){
        const y=-0.5+yi; if(y>top-0.5+1e-6) break;
        let open=false;
        for(const c of [-2.8,2.8]){const dz=zl-c; if(Math.abs(dz)<2.2 && y<-0.6+Math.sqrt(4.84-dz*dz)) open=true;}
        if(open) continue;
        sb(x,y,z0+zl,1,1,1,y>top-1?'#9a948a':'#b9ad98',null,0.06);
      }
      if(edge&&az<7.5) sb(x,top+0.5,z0+zl,1,1,1,'#cfc3aa',null,0.05);
    }
  }
}
function bridgeY(zl){const a=Math.abs(zl);return a<5.5?3:a<9?3-2*(a-5.5)/3.5:Math.max(0,1-(a-9)/2);}

// ---------- buildings ----------
const bldRects=[]; const chimneys=[];
function house(cx,cz,w,d,F,yaw,seed){
  const c=Math.round(Math.cos(yaw)),s=Math.round(Math.sin(yaw)),sw=Math.abs(s)===1;
  const bs=(lx,ly,lz,sx,sy,sz,hex,jit=0.04)=>{sb(cx+lx*c+lz*s,ly,cz-lx*s+lz*c,sw?sz:sx,sy,sw?sx:sz,hex,null,jit);};
  const shut=pick(['#74879c','#6b7f70','#8a7a68']);
  const nxw=w/2,nd=d/2;
  AO=1;
  for(let f=0;f<F;f++){
    const yc=f*2+1, wall=f===0?'#cdb98f':'#e6d3a8';
    for(let i=0;i<nxw;i++)for(let k=0;k<nd;k++){
      if(!(i===0||i===nxw-1||k===0||k===nd-1)) continue;
      const lx=-w/2+1+2*i, lz=-d/2+1+2*k;
      bs(lx,yc,lz,2,2,2,wall,0.03);
      const faces=[];
      if(k===nd-1) faces.push([0,1]); if(k===0) faces.push([0,-1]);
      if(i===0) faces.push([-1,0]); if(i===nxw-1) faces.push([1,0]);
      for(const [nx,nz] of faces){
        const fb=nz!==0;
        const px=lx+nx*1.07, pz=lz+nz*1.07;
        const door=f===0&&rnd()<0.4;
        const lit=!door&&rnd()<0.12;
        const wc=door?'#4a3626':lit?'#f0c070':'#2a3340';
        if(fb) bs(px,yc+(door?-0.2:0.1),pz,door?0.95:0.9,door?1.5:1.1,0.14,wc,0.03);
        else bs(px,yc+(door?-0.2:0.1),pz,0.14,door?1.5:1.1,door?0.95:0.9,wc,0.03);
        if(fb&&f>=1){
          bs(lx,yc-0.62,lz+nz*1.12,1.3,0.12,0.3,'#f4ead0',0.02);
          bs(lx-0.78,yc+0.1,lz+nz*1.1,0.26,1.15,0.1,shut,0.04);
          bs(lx+0.78,yc+0.1,lz+nz*1.1,0.26,1.15,0.1,shut,0.04);
          if(f===1||f===F-1){ bs(lx,yc-0.93,lz+nz*1.2,2,0.14,0.6,'#2a2a2e',0.02); bs(lx,yc-0.6,lz+nz*1.47,2,0.5,0.07,'#2a2a2e',0.02); }
        }
      }
    }
  }
  AO=0;
  const yr=2*F;
  const zinc=['#7c868f','#737d86','#838c95'];
  for(let m=0;m<3;m++){
    const hx=w/2-0.5-m, hz=d/2-0.5-m;
    for(let x=-hx;x<=hx+1e-6;x+=1)for(let z=-hz;z<=hz+1e-6;z+=1){
      if(!(Math.abs(Math.abs(x)-hx)<1e-6||Math.abs(Math.abs(z)-hz)<1e-6)) continue;
      bs(x,yr+0.5+m,z,1,1,1,pick(zinc),0.05);
    }
  }
  { const hx=w/2-3.5,hz=d/2-3.5;
    for(let x=-hx;x<=hx+1e-6;x+=1)for(let z=-hz;z<=hz+1e-6;z+=1) bs(x,yr+3.5,z,1,1,1,'#69727b',0.05); }
  for(let i=1;i<nxw-1;i+=2) for(const nz of [1,-1]){
    const lx=-w/2+1+2*i;
    bs(lx,yr+0.7,nz*(d/2+0.45),1.0,1.0,0.8,'#e6d3a8',0.03);
    bs(lx,yr+0.7,nz*(d/2+0.9),0.5,0.5,0.1,'#2a3340',0.02);
    bs(lx,yr+1.35,nz*(d/2+0.45),1.3,0.25,1.1,'#7c868f',0.03);
  }
  const nch=2+(seed%2);
  for(let k=0;k<nch;k++){
    const lx=-w/2+3+(w-6)*(k+0.5)/nch, lz=rr(-0.8,0.8);
    bs(lx,yr+4.6,lz,0.9,2.2,0.9,'#9b5944',0.05); bs(lx,yr+5.8,lz,1.1,0.22,1.1,'#6a5a50',0.03);
    bs(lx-0.2,yr+6.05,lz,0.26,0.4,0.26,'#3b3b3b',0.03); bs(lx+0.2,yr+6.05,lz,0.26,0.4,0.26,'#3b3b3b',0.03);
    if(k===0&&seed%3===0) chimneys.push([cx+lx*c+lz*s,yr+6.3,cz-lx*s+lz*c]);
  }
  const hx=sw?d/2+1:w/2+1,hz=sw?w/2+1:d/2+1; bldRects.push([cx-hx,cx+hx,cz-hz,cz+hz]);
}
function buildings(){
  let n=0;
  const ok=(cx,cz,w,d,yaw)=>{const sw=Math.abs(Math.sin(yaw))>0.5;const hx=(sw?d:w)/2,hz=(sw?w:d)/2;
    return [[-1,-1],[1,-1],[-1,1],[1,1]].every(([a,b])=>inside(cx+a*hx,cz+b*hz,0.96,0));};
  let x=-39;
  while(x<39){const w=pick([12,14,16,18]);const cx=x+w/2;if(ok(cx,-33.5,w,8,0)) house(cx,-33.5,w,8,ri(4,5),0,n++);x+=w+0.5;}
  let z=-27;
  while(z<21){const w=pick([12,14,16]);const cz=z+w/2;
    if(cz+w/2>22) break;
    if(ok(-43,cz,w,8,Math.PI/2)) house(-43,cz,w,8,ri(4,5),Math.PI/2,n++);
    if(ok(43,cz,w,8,-Math.PI/2)) house(43,cz,w,8,ri(4,5),-Math.PI/2,n++);
    z+=w+0.5;}
}
function tree(x,z,s=1){
  const q=qyaw(rnd()*6.28), g=pick(['#4f8a3c','#5f9a45','#3f7a38','#6aa04a']);
  sb(x,0.6*s,z,0.4*s,1.2*s,0.4*s,'#5a3b24',null,0.08);
  sb(x,1.9*s,z,2.2*s,1.4*s,2.2*s,g,q,0.1); sb(x,3.0*s,z,1.7*s,1.0*s,1.7*s,g,q,0.1); sb(x,3.8*s,z,1.0*s,0.8*s,1.0*s,g,q,0.1);
}
const inBld=(x,z,m=2)=>bldRects.some(r=>x>r[0]-m&&x<r[1]+m&&z>r[2]-m&&z<r[3]+m);
function trees(){
  for(let z=-24;z<=22;z+=5.5){tree(-36.8,z);tree(36.8,z);}
  for(let x=-32;x<=32;x+=5.5){ if(Math.abs(x-BRX)<4.5) continue; tree(x,-26.2); tree(x,25.2); }
  for(let x=-34;x<=34;x+=6){ if(Math.abs(x-BRX)<5) continue; const z=zc(x)+HW+1+1.8; if(inside(x,z,0.93,0)) tree(x,z,0.9); }
  let cnt=0,tries=0;
  while(cnt<44&&tries<600){tries++;const x=rr(-56,56),z=rr(-48,48);
    if(!inside(x,z,0.9,0)||ground(x,z)!=='g'||inBld(x,z,3)) continue;
    if(Math.abs(x)<38&&Math.abs(z)<27) continue;
    if(Math.abs(x-BRX)<6&&z>20) continue;
    tree(x,z,rr(0.8,1.15));cnt++;}
  for(let z=-22;z<=22;z+=11){for(const x of [-34,34]){sb(x,1.3,z,0.2,2.6,0.2,'#2b2b2e');sb(x,2.8,z,0.5,0.5,0.5,'#e8d9a0',null,0.02);}}
}

// ---------- tower ----------
const IRON='#5a2e22', IRON2='#693626';
const wc = y => 1.6+15.4*Math.exp(-y/24);
const hl = y => 3.4-1.2*Math.min(y,14)/14;
const CC=[[0,0],[1,0],[1,1],[0,1]], CS=[[1,1],[-1,1],[-1,-1],[1,-1]];
const legCorner=(sx,sz,i,y)=>{const w=wc(y),h=hl(y);return P3(sx*(w-2*h*CC[i][0]),y,sz*(w-2*h*CC[i][1]));};
const colCorner=(i,y)=>P3(CS[i][0]*wc(y),y,CS[i][1]*wc(y));
function lattice(p0a,p0b,p1a,p1b,o){
  const len=p0a.distanceTo(p0b), n=Math.max(1,Math.round(len/3.4));
  const L=(a,b,t)=>a.clone().lerp(b,t);
  for(let i=0;i<n;i++){
    const t0=i/n,t1=(i+1)/n;
    const a0=L(p0a,p0b,t0),b0=L(p0a,p0b,t1),a1=L(p1a,p1b,t0),b1=L(p1a,p1b,t1);
    if(o.x!==false){
      if(o.single){ if(rnd()<0.5) beam(a0,b1,o.sz,IRON2); else beam(b0,a1,o.sz,IRON2); }
      else { beam(a0,b1,o.sz,IRON2); beam(b0,a1,o.sz,IRON2); }
    }
    if(o.ring!==false) beam(a1,b1,o.rs||o.sz,IRON);
    if(o.bottom) beam(a0,b0,o.rs||o.sz,IRON);
    if(i>0&&o.v!==false) beam(a0,a1,o.sz*0.9,IRON2);
  }
}
function truss(ax,az,bx,bz,y,len){ // girder band between two deck points
  beam6(ax,y-0.5,az,bx,y-0.5,bz,0.95,IRON); beam6(ax,y+1.2,az,bx,y+1.2,bz,0.7,IRON);
  const n=Math.max(1,Math.round(len/1.6));
  for(let i=0;i<=n;i++){const t=i/n,t2=(i+1)/n,x=ax+(bx-ax)*t,z=az+(bz-az)*t;
    beam6(x,y-0.5,z,x,y+1.2,z,0.32,IRON2);
    if(i<n){const x2=ax+(bx-ax)*t2,z2=az+(bz-az)*t2; beam6(x,y-0.5,z,x2,y+1.2,z2,0.28,IRON2); beam6(x,y+1.2,z,x2,y-0.5,z2,0.28,IRON2);}
  }
}
const sparkSpots=[];
function tower(){
  AO=1;
  for(const [sx,sz] of CS){
    for(let i=0;i<4;i++) for(let y=0;y<14-1e-6;y+=1.75) beam(legCorner(sx,sz,i,y),legCorner(sx,sz,i,y+1.75),i===0?0.9:0.75,IRON);
    for(let k=0;k<4;k++){const y0=3.5*k,y1=y0+3.5;
      for(let i=0;i<4;i++){const j=(i+1)%4; lattice(legCorner(sx,sz,i,y0),legCorner(sx,sz,j,y0),legCorner(sx,sz,i,y1),legCorner(sx,sz,j,y1),{sz:0.42,bottom:k===0});}}
  }
  AO=0;
  // arches between legs
  for(const sg of [-1,1]) for(const ax of [0,1]){

    const f=Math.sin(TAU*28*t/T+b.fp);
    fb(0,0,0,0.6,0.3,0.32,PIG); fb(0.36,0.1,0,0.2,0.2,0.2,PIG2); fb(-0.38,-0.02,0,0.3,0.08,0.2,PIG);
    for(const sd of [-1,1]){ fl(0,0.08,sd*0.12,-0.05,0.08+0.5*f,sd*0.8,0.13,PIG2); }
  }
}
const clouds=[];
[[-95,-6,-30],[100,8,-40],[-85,-20,40],[95,-18,30],[0,-8,-110],[-40,25,-100],[55,18,-105],[-112,10,-10],[120,-4,10]].forEach(([x,y,z],i)=>{
  const parts=[];const n=ri(7,11);for(let k=0;k<n;k++)parts.push([rr(-8,8),rr(-1.5,2),rr(-4,4),rr(4,9),rr(2,4)]);clouds.push({x,y,z,parts,ph:i*1.3});
});
function updClouds(t){
  const cw=C('#fff3e4'),cs=C('#f4d6c0');
  for(const c of clouds){const dx=5*Math.sin(TAU*t/T+c.ph);
    for(const p of c.parts) db(c.x+dx+p[0],c.y+p[1],c.z+p[2],p[3],p[4],p[3]*0.7,null,p[1]>0.5?cw:cs);}
}
let edgeL=-46,edgeR=46;
{const f=s=>{for(let x=30;x<70;x+=0.5){if(!inside(s*x,zc(s*x),1,0))return s*(x-0.5);}return s*60;};edgeL=f(-1);edgeR=f(1);}
function updFalls(t){
  const wcol=C('#7ec4c8'),wlt=C('#e8f6f8');
  for(const [ex,sg] of [[edgeL,-1],[edgeR,1]]) for(let i=0;i<16;i++){
    const u=fract(t/3.5+i/16), z=zc(ex)+(((i*7)%16)/16-0.5)*(2*HW-1);
    const y=-0.7-18*u*u, st=0.9+1.5*u;
    _c.copy(wcol).lerp(wlt,u*u); db(ex+sg*(0.3+0.8*u),y,z,0.9*(1-0.5*u),st,0.9,null,_c);
  }
}

// ---------- animation ----------
function updPeople(t){
  for(const w of walkers){
    const th=TAU*w.k*t/T+w.ph, s=0.5-0.5*Math.cos(th), v=Math.sin(th);
    const x=w.ax+(w.bx-w.ax)*s, z=w.az+(w.bz-w.az)*s, dir=v>=0?1:-1;
    const yaw=Math.atan2((w.bx-w.ax)*dir,(w.bz-w.az)*dir);
    const amp=Math.min(1,Math.abs(v)*3);
    person(x,w.y,z,yaw,w.P,s*w.len*3.5,amp,Math.abs(Math.sin(s*w.len*3.5))*0.03*amp,null);
  }
  for(const p of idlers){
    const bob=0.05*Math.abs(Math.sin(TAU*p.kb*t/T+p.ph));
    person(p.x,p.y,p.z,p.yaw+0.12*Math.sin(TAU*2*t/T+p.sway),p.P,0,0,bob,null);
  }
  for(const r of rivets){
    const th=TAU*r.fk*t/T+r.ph, sw=0.5+0.5*Math.sin(th);
    const a=0.15+1.45*sw*sw;
    person(r.A.x,r.y,r.A.z,r.A.yaw,r.A.P,0,0,0,{a});
    person(r.B.x,r.y,r.B.z,r.B.yaw,r.B.P,0,0,0.01*Math.sin(th*0.5),{a:0.9+0.05*Math.sin(th)});
    const s=fract(th/TAU-0.75);
    const glow=0.45+0.55*(1-s);
    sbk(r.x,r.y+0.14,r.z,0.26,4*glow,1.3*glow,0.25*glow);
    if(s<0.55){const u=s/0.55;
      for(const v of r.v){sbk(r.x+v[0]*u*0.9,r.y+0.15+v[1]*u-2.2*u*u,r.z+v[2]*u*0.9,0.17*(1-u)*v[3],7*v[3],2.4*v[3],0.5);}
    }
  }
}
function camAt(t){
  const u=t/T, e=0.5-0.5*Math.cos(Math.PI*u);
  const az=(-13+25*e)*Math.PI/180, el=(25.5-1.5*e)*Math.PI/180;
  const D=178-18*e;
  const tx=0,ty=16+2*e,tz=4-3*e;
  camera.position.set(tx+D*Math.sin(az)*Math.cos(el),ty+D*Math.sin(el),tz+D*Math.cos(az)*Math.cos(el));
  camera.lookAt(tx,ty,tz);
}
function renderAt(t){
  dn=0; sn_=0;
  updWater(t); updPeople(t);
  for(let i=0;i<4;i++){cart((i*33.4+72*t/T),i,t);}
  carriage(1,0,t,0); carriage(-1,0.5,t,1);
  boat(t); updCranes(t); updBirds(t); updClouds(t); updFalls(t); updEmitters(t);
  // engine flywheel
  frame(24,0,-13,0,1);
  for(let k=0;k<12;k++){const aa=TAU*40*t/T+k*Math.PI/6;fb(-0.5+1.3*Math.cos(aa),2.6+1.3*Math.sin(aa),1.5,0.28,0.28,0.2,C('#8a2a22'));}
  fl(-0.5+1.3*Math.cos(TAU*40*t/T),2.6+1.3*Math.sin(TAU*40*t/T),1.5,-0.5-1.3*Math.cos(TAU*40*t/T),2.6-1.3*Math.sin(TAU*40*t/T),1.5,0.12,C('#8a2a22'));
  dynMesh.count=dn; dynMesh.instanceMatrix.needsUpdate=true; dynMesh.instanceColor.needsUpdate=true;
  sparkMesh.count=sn_; sparkMesh.instanceMatrix.needsUpdate=true; sparkMesh.instanceColor.needsUpdate=true;
  camAt(t);
  composer.render();
}
window.renderAt=renderAt; window.camera=camera;
window.stats=()=>({staticCount:STATIC_COUNT,dyn:dn,sparks:sn_,water:waterCells.length,calls:renderer.info.render.calls,tris:renderer.info.render.triangles});
renderAt(0);
window.ready=true;
if(!location.search.includes('capture')){
  const loop=ts=>{renderAt((ts/1000)%T);requestAnimationFrame(loop);};
  requestAnimationFrame(loop);
}
</script></body></html>
