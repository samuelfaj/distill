}
const GRASS=[0x6f9a4a,0x78a24f,0x68924a],DIRT=[0x8a6b49,0x7a5c3d,0x96764f,0x6e5236],COB=[0xa89f8c,0x9a917f,0xb3aa97],PAVE=[0xbdb4a2,0xaea592,0xc6bdaa];

 const top=riv?-3:-1;

  if(adz<HW){for(const c of[-4.2,0,4.2]){const ddz=dz-c;if(Math.abs(ddz)<2.0&&(yc<-0.2||ddz*ddz+(yc+0.2)*(yc+0.2)<4)){open=true;break}}}
