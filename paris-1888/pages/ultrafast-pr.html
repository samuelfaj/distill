// Deterministic everything: seed Math.random (used by GTAO noise) and our own generator.
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
Math.random = mulberry(1888);
const R = mulberry(31889);
const W = 1280, H = 720, DURATION = 14, FPS = 30;

function hash(x,y=0,z=0){let h=((x|0)*73856093)^((y|0)*19349663)^((z|0)*83492791);h=Math.imul(h^(h>>>16),0x45d9f3b);h=Math.imul(h^(h>>>16),0x45d9f3b);h^=h>>>16;return (h>>>0)/4294967296;}
function vnoise(x,z,s=0){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
  const a=hash(xi,zi,s),b=hash(xi+1,zi,s),c=hash(xi,zi+1,s),d=hash(xi+1,zi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
const frac=x=>x-Math.floor(x);
const lerp=(a,b,k)=>a+(b-a)*k;
const pick=a=>a[Math.floor(R()*a.length)];
const tmpC=new THREE.Color();
const col=h=>{tmpC.set(h);return {r:tmpC.r,g:tmpC.g,b:tmpC.b};};
const jit=(h,a,r)=>{tmpC.set(h);const k=1+(r-0.5)*2*a;return {r:tmpC.r*k,g:tmpC.g*k,b:tmpC.b*k};};
const hdr=(r,g,b)=>({r,g,b});

// ---------------------------------------------------------------- renderer / scene
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, powerPreference:'high-performance'});
renderer.setPixelRatio(1);
renderer.setSize(W,H,false);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ const c=document.createElement('canvas');c.width=4;c.height=512;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#5f86b8');gr.addColorStop(0.35,'#a9bcd0');gr.addColorStop(0.58,'#f0cfa6');gr.addColorStop(0.75,'#f3c294');gr.addColorStop(1,'#d9a37e');
  g.fillStyle=gr;g.fillRect(0,0,4,512);
  const tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;scene.background=tex; }
scene.fog = new THREE.FogExp2(0xe8c49c, 0.0021);

const camera = new THREE.PerspectiveCamera(34, W/H, 1, 1500);

const hemi = new THREE.HemisphereLight(0xaec4e0, 0x8a6446, 1.15);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc98f, 3.4);
const SUN_DIR = new THREE.Vector3(-1.0, 0.62, 0.55).normalize();
sun.position.copy(SUN_DIR).multiplyScalar(220);
sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-118,right:118,top:118,bottom:-118,near:20,far:460});
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 3;
scene.add(sun); scene.add(sun.target);

const GEO = new RoundedBoxGeometry(1,1,1,1,0.12);
const matStd = new THREE.MeshStandardMaterial({roughness:0.86, metalness:0.0});
const matSmoke = new THREE.MeshStandardMaterial({roughness:1, metalness:0});
const matGlow = new THREE.MeshBasicMaterial({color:0xffffff});

// ---------------------------------------------------------------- static voxel store
const SP=[], SC=[];
function sbox(x,y,z,sx,sy,sz,c){SP.push(x,y,z,sx,sy,sz);SC.push(c.r,c.g,c.b);}
class Grid{
  constructor(s,floor=-1e9){this.s=s;this.floor=floor;this.m=new Map();}
  key(x,y,z){return ((x+1000)*2048+(y+1000))*2048+(z+1000);}
  set(x,y,z,c){this.m.set(this.key(x,y,z),[x,y,z,c]);}
  has(x,y,z){return y<this.floor||this.m.has(this.key(x,y,z));}
  emit(){const s=this.s;for(const [,v] of this.m){const [x,y,z,c]=v;
    if(this.has(x+1,y,z)&&this.has(x-1,y,z)&&this.has(x,y+1,z)&&this.has(x,y-1,z)&&this.has(x,y,z+1)&&this.has(x,y,z-1))continue;
    sbox((x+.5)*s,(y+.5)*s,(z+.5)*s,s,s,s,c);}}
}
const G1=new Grid(1,-6), G2=new Grid(2), GF=new Grid(0.5);
const beamSeen=new Set();
function beam(x0,y0,z0,x1,y1,z1,s,cf){
  const d=Math.hypot(x1-x0,y1-y0,z1-z0),n=Math.max(1,Math.ceil(d/(s*0.5)));
  for(let i=0;i<=n;i++){const k=i/n;const ix=Math.round(lerp(x0,x1,k)/s),iy=Math.round(lerp(y0,y1,k)/s),iz=Math.round(lerp(z0,z1,k)/s);
    const key=s+'|'+ix+'|'+iy+'|'+iz;if(beamSeen.has(key))continue;beamSeen.add(key);
    sbox(ix*s,iy*s,iz*s,s,s,s,typeof cf==='function'?cf():typeof cf==='string'?col(cf):cf);}
}

// ---------------------------------------------------------------- island layout
const zr = x => 36 - 5*Math.sin(x/30) - 0.00105*x*x;           // Seine centerline
const zrd = x => (zr(x+0.5)-zr(x-0.5));
const edgeVal=(x,z)=>(x/90)**2+(z/68)**2+0.16*(vnoise(x*0.06,z*0.06,7)-0.5);
const inside=(x,z)=>edgeVal(x,z)<1;
const TZ=-6;                                                    // tower center z
const inYard=(x,z)=>Math.abs(x)<42&&z>-46&&z-zr(x)<-11;
const inAlley=(x,z)=>!inYard(x,z)&&Math.abs(x)<47.5&&z>-51&&z-zr(x)<-11;

const P_GRASS=['#7d9a4c','#87a352','#728f45','#8fa65a'];
const C={
  dirt:'#a9825a', dirt2:'#957049', gravel:'#c9b48e', cobble:'#a79c8a', stone:'#bdb2a0', stoneD:'#9d9282',
  water:'#4f7f8f', soil:'#7a5a3e', soil2:'#664a33', iron:'#6a2f22', ironD:'#4f231a', wood:'#9c7148', woodD:'#76532f',
  zinc:'#8b949c', zinc2:'#79828b', win:'#46505c', shop:'#5c4433', black:'#1f1f22'
};
const CREAMS=['#ecdfc4','#e6d7b8','#f0e5cc','#ddcdae','#e9dbbf'];
const ROCK=['#9a8670','#857360','#a8927a','#78665a','#8e7b66','#6f5e50'];
const trees=[], chimneys=[];

// terrain + buildings
for(let x=-93;x<93;x++)for(let z=-72;z<72;z++){
  const cx=x+0.5,cz=z+0.5,ev=edgeVal(cx,cz);if(ev>=1)continue;
  const d=cz-zr(cx), n=hash(x,z,1);
  if(Math.abs(d)<6){for(let y=-6;y<=-6;y++)G1.set(x,y,z,col(C.soil2));G1.set(x,-5,z,jit(C.water,0.06,n));continue;}
  if(Math.abs(d)<8){for(let y=-6;y<-1;y++)G1.set(x,y,z,jit(y%2?C.stone:C.stoneD,0.05,hash(x,y,z)));G1.set(x,-1,z,jit(C.stone,0.05,n));continue;}
  let top;
  const rim = ev>0.93;
  if(inYard(cx,cz)){ top = Math.abs(cx)<3? jit(C.gravel,0.05,n) : jit(vnoise(cx*0.15,cz*0.15,3)>0.55?C.dirt2:C.dirt,0.07,n); }
  else if(inAlley(cx,cz)){ top=jit(C.gravel,0.06,n);
    if((Math.abs(Math.abs(cx)-44.5)<0.6&&z%3===0)||(Math.abs(cz+48.5)<0.6&&x%3===0&&Math.abs(cx)<44))trees.push([x,z]); }
  else if(d>=-11&&d<-8 || d>=8&&d<11){ top=jit(C.cobble,0.05,n); }
  else if(d>=11&&Math.abs(cx)<16){ top = Math.abs(cx)<3? jit(C.gravel,0.05,n) : jit(pick(P_GRASS),0.05,n);
    if(Math.abs(cx)>4&&Math.abs(cx)<15&&x%4===0&&z%4===0&&!rim)trees.push([x,z]); }
  else if(rim){ top=jit(pick(P_GRASS),0.06,n); }
  else {
    // city blocks
    const bxI=Math.floor((x+90)/22),lx=x+90-bxI*22,bzI=Math.floor((z+72)/17),lz=z+72-bzI*17;
    const inBlock=lx<17&&lz<12, dE=Math.min(lx,16-lx,lz,11-lz), park=hash(bxI,bzI,9)<0.12;
    if(inBlock&&park){ top=jit(pick(P_GRASS),0.05,n); if(lx%4===2&&lz%4===2&&ev<0.88)trees.push([x,z]); }
    else if(inBlock&&dE<4&&ev<0.9){
      top=jit(C.cobble,0.04,n);
      const lk1=Math.floor((x+90)/6),lk2=Math.floor((z+72)/5);
      const Hw=6+Math.floor(hash(lk1,lk2,3)*3), wall=CREAMS[Math.floor(hash(lk1,lk2,4)*CREAMS.length)];
      let nx=0,nz=0;if(lx===0)nx=-1;else if(lx===16)nx=1;else if(lz===0)nz=-1;else if(lz===11)nz=1;
      const facade=dE===0, along=nz!==0?x:z, win=((along%2)+2)%2===0;
      for(let y=0;y<Hw;y++){
        let c;
        if(facade&&y===0)c=win?col(C.shop):jit('#cdbfa2',0.04,hash(x,y,z));
        else if(facade&&win)c=jit(C.win,0.05,hash(x,y,z));
        else c=jit(wall,0.025,hash(x,y,z));
        G1.set(x,y,z,c);
        if(facade&&(y===2||y===Hw-1))sbox(cx+nx*0.56,y+0.1,cz+nz*0.56,nx?0.14:1.0,0.12,nz?0.14:1.0,col('#2c2826'));
      }
      if(dE>=1)G1.set(x,Hw,z,(dE===1&&((along%3)+3)%3===0)?jit(wall,0.03,n):jit(C.zinc,0.05,n));
      if(dE>=2)G1.set(x,Hw+1,z,jit(C.zinc2,0.05,n));
      if(dE===2&&hash(x,z,5)<0.09){G1.set(x,Hw+2,z,jit(hash(x,z,6)<0.5?'#b98a6a':wall,0.05,n));
        sbox(cx-0.2,Hw+3.15,cz,0.25,0.3,0.25,col('#a85f45'));sbox(cx+0.2,Hw+3.15,cz,0.25,0.3,0.25,col('#a85f45'));chimneys.push([cx,Hw+3.3,cz]);}
    } else {
      top=jit(C.cobble,0.05,n);
      if(inBlock===false&&ev<0.88){ // street centerlines
        if((lx===19&&lz<12&&((z%4)+4)%4===0)||(lz===14&&lx<17&&((x%4)+4)%4===0))trees.push([x,z]);
      }
    }
  }
  G1.set(x,-1,z,top);
  G1.set(x,-2,z,rim?jit(C.soil,0.06,n):jit(C.soil,0.05,n));G1.set(x,-3,z,jit(C.soil2,0.06,n));
  for(let y=-6;y<-3;y++)G1.set(x,y,z,jit(ROCK[(-y+Math.floor(n*2))%ROCK.length],0.05,hash(x,y,z)));
}
// quay trees and parapets
for(let x=-80;x<=80;x++){
  for(const s of [-1,1]){const zz=zr(x+0.5)+s*6.25;if(Math.abs(x)>4&&inside(x+0.5,zz+s*2))sbox(x+0.5,0.25,zz,1.0,0.5,0.4,jit(C.stone,0.04,hash(x,s,2)));
    if(Math.abs(x)>6&&x%4===0){const tz=Math.floor(zr(x)+s*7.3);if(inside(x,tz+s*3))trees.push([x,tz]);}}
}
// arched stone bridge over the Seine at x=0
{const zc=zr(0);for(let x=-4;x<4;x++)for(let z=Math.floor(zc-9);z<=Math.ceil(zc+9);z++){const dz=z+0.5-zc;
  for(let y=-5;y<=-1;y++){let open=false;for(const ac of [-4.2,0,4.2]){const u=(dz-ac)/1.7,v=(y+5.5)/3.6;if(u*u+v*v<1)open=true;}
    if(!open)G1.set(x,y,z,jit(y===-1?C.cobble:(y+z)%2?C.stone:C.stoneD,0.05,hash(x,y,z)));}
  if(x===-4||x===3)G1.set(x,0,z,jit(C.stone,0.04,hash(x,z,3)));}}
for(const [x,z] of trees){const h=hash(x,z,8),g=['#5f7f3a','#6e8c40','#557535','#7a9346','#86964a'];
  G1.set(x,0,z,col('#5a4232'));G1.set(x,1,z,col('#5a4232'));
  for(let i=-1;i<=1;i++)for(let k=-1;k<=1;k++){G1.set(x+i,2,z+k,jit(g[Math.floor(h*5)],0.1,hash(x+i,z+k,9)));
    if(Math.abs(i)+Math.abs(k)<2)G1.set(x+i,3,z+k,jit(g[Math.floor(h*5)],0.1,hash(x+i,z+k,10)));}
  if(h>0.5)G1.set(x,4,z,jit(g[Math.floor(h*5)],0.1,h));
}
// rock underside (2-unit voxels, stratified)
for(let X=-47;X<47;X++)for(let Z=-37;Z<37;Z++){
  const cx=2*X+1,cz=2*Z+1,ev=edgeVal(cx,cz);if(ev>=0.99)continue;
  const nn=vnoise(cx*0.07,cz*0.07,11),D=Math.round(1+Math.pow(1-ev,0.8)*21*(0.65+0.7*nn));
  for(let i=0;i<D;i++){const iy=-4-i;const band=Math.floor((-iy*0.8+vnoise(cx*0.05,cz*0.05,12)*3));
    const c=jit(ROCK[band%ROCK.length],0.06,hash(X,iy,Z));if(i>=D-2){c.r*=0.8;c.g*=0.8;c.b*=0.8;}
    G2.set(X,iy,Z,c);}
}
// small floating rocks
for(const [fx,fy,fz,r] of [[-50,-9,52,2],[55,-13,48,1.6],[-88,-16,-12,1.8],[86,-20,6,1.4],[30,-26,58,1.3],[-30,-31,56,1.5]]){
  for(let X=-3;X<=3;X++)for(let Y=-3;Y<=1;Y++)for(let Z=-3;Z<=3;Z++){if(X*X+(Y*1.6)**2+Z*Z<r*r+hash(X,Y,Z)*1.5)G2.set(Math.round(fx/2)+X,Math.round(fy/2)+Y,Math.round(fz/2)+Z,jit(pick(ROCK),0.06,R()));}
  for(let X=-1;X<=1;X++)for(let Z=-1;Z<=1;Z++)if(R()<0.8)G2.set(Math.round(fx/2)+X,Math.round(fy/2)+2,Math.round(fz/2)+Z,jit(pick(P_GRASS),0.05,R()));
}

// ---------------------------------------------------------------- yard furniture
// fence
{const post=()=>jit(C.woodD,0.08,R());
  for(let x=-42;x<=42;x+=2){if(Math.abs(x)<5)continue;const z=zr(x)-11.3;sbox(x,0.5,z,0.2,1.0,0.2,post());sbox(x+1,0.75,z,2,0.1,0.1,post());sbox(x+1,0.35,z,2,0.1,0.1,post());}
  for(const s of [-1,1])for(let z=-46;z<zr(42)-11.3;z+=2){if(Math.abs(z+6)<3)continue;sbox(s*42,0.5,z,0.2,1.0,0.2,post());sbox(s*42,0.75,z+1,0.1,0.1,2,post());sbox(s*42,0.35,z+1,0.1,0.1,2,post());}
  for(let x=-42;x<42;x+=2){if(Math.abs(x)<4)continue;sbox(x,0.5,-46,0.2,1.0,0.2,post());sbox(x+1,0.75,-46,2,0.1,0.1,post());}
}
// wooden sheds
function shed(x0,z0,w,d,h,alongX){
  const plank=['#9a6e46','#8a613c','#a77a50'],roof=hash(x0,z0,1)<0.5?'#5b5450':'#8a4a36';
  for(let x=x0;x<x0+w;x++)for(let z=z0;z<z0+d;z++)for(let y=0;y<h;y++){
    const edge=x===x0||x===x0+w-1||z===z0||z===z0+d-1;if(!edge)continue;
    const door=(alongX?(z===z0+d-1&&x===x0+Math.floor(w/2)):(x===x0+w-1&&z===z0+Math.floor(d/2)))&&y<2;
    const winw=y===1&&((alongX?x:z)%3===0);
    G1.set(x,y,z,door?col('#3b2a1e'):winw?col('#3d4048'):jit(plank[((alongX?x:z)%3+3)%3],0.05,hash(x,y,z)));}
  const span=alongX?d:w;for(let k=0;k<Math.ceil(span/2);k++)for(let x=x0-(alongX?1:0)+(alongX?0:k);x<x0+w+(alongX?1:0)-(alongX?0:k);x++)for(let z=z0-(alongX?0:1)+(alongX?k:0);z<z0+d+(alongX?0:1)-(alongX?k:0);z++)G1.set(x,h+k,z,jit(roof,0.06,hash(x,z,k)));
}
shed(-40,-22,6,9,3,false);shed(34,-30,6,8,3,false);shed(34,2,6,10,3,false);shed(-24,-44,11,5,3,true);shed(12,-44,10,5,3,true);shed(-40,-38,6,7,3,false);
// girder stacks
const girderStacks=[[25,-13,0],[-25,-14,1],[25,1,1],[-25,2,0],[-2,-41,0],[-12,18,1],[13,18,0]];
for(const [gx,gz,dir] of girderStacks){const layers=3+Math.floor(hash(gx,gz)*3);
  for(let l=0;l<layers;l++){const ax=(l+dir)%2===0;const n=4;for(let i=0;i<n;i++){const off=(i-(n-1)/2)*0.75;const c=jit(R()<0.5?C.iron:C.ironD,0.12,R());
    if(ax)sbox(gx,0.22+l*0.45,gz+off,6,0.42,0.42,c);else sbox(gx+off,0.22+l*0.45,gz,0.42,0.42,6,c);}}}
// prefabricated lattice panels lying in the yard
for(const [px,pz] of [[-30,-28],[29,-24],[-31,13],[18,-38]]){const L=7,Wd=1.6;
  beam(px-L/2,0.25,pz,px+L/2,0.25,pz,0.35,C.iron);beam(px-L/2,0.25,pz+Wd,px+L/2,0.25,pz+Wd,0.35,C.iron);
  for(let i=0;i<L;i+=1.4){beam(px-L/2+i,0.25,pz,px-L/2+i+1.4,0.25,pz+Wd,0.3,C.ironD);beam(px-L/2+i+1.4,0.25,pz,px-L/2+i,0.25,pz+Wd,0.3,C.ironD);}}
// steam engine (boiler + chimney)
const ENGINE={x:-36.5,z:10,chimneyTop:9.5};
for(let ix=-9;ix<=1;ix++)for(let iy=0;iy<6;iy++)for(let iz=-3;iz<=2;iz++){const yy=(iy+0.5)*0.5-1.4,zz=(iz+0.5)*0.5;
  if(yy*yy+zz*zz<1.25)GF.set(Math.floor(ENGINE.x/0.5)+ix,iy,Math.floor(ENGINE.z/0.5)+iz,ix===-6||ix===-2?col('#b08a3c'):jit('#2f3a34',0.05,R()));}
for(let ix=2;ix<=4;ix++)for(let iy=0;iy<5;iy++)for(let iz=-2;iz<=1;iz++)GF.set(Math.floor(ENGINE.x/0.5)+ix,iy,Math.floor(ENGINE.z/0.5)+iz,jit('#3a2c26',0.05,R()));
for(let iy=0;iy<19;iy++)GF.set(Math.floor(ENGINE.x/0.5)+3,iy+5,Math.floor(ENGINE.z/0.5),col(iy===17?'#8a3a2a':'#2a2626'));
sbox(ENGINE.x+1.75,9.6,ENGINE.z+0.25,0.8,0.25,0.8,col('#2a2626'));

// ---------------------------------------------------------------- the tower
const Hb=h=>21*Math.exp(-h/39.5);
const Wl=h=>h<=19?7-2.5*h/19:4.5-1.0*(h-19)/19;
const ironC=()=>jit(R()<0.5?'#6e3224':'#5f2a1f',0.1,R());
const ironDC=()=>jit('#4c2219',0.1,R());
const woodC=()=>jit(R()<0.5?'#a87c50':'#94683f',0.08,R());
const TB=(a,ya,b,yb,s,cf)=>beam(a[0],ya,a[1]+TZ,b[0],yb,b[1]+TZ,s,cf);
const L2=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k)];
function legC(sx,sz,h){const b=Hb(h),a=b-Wl(h);return [[sx*a,sz*a],[sx*b,sz*a],[sx*b,sz*b],[sx*a,sz*b]];}
const struts=[];

      put(DY,xx,2.1-j*0.0,wav,0.14,0.75,0.06,cols[i]);}}
  // steam engine: flywheel, piston, smoke
  {const a=t*3.2;frame(ENGINE_FLY.x,ENGINE_FLY.y,ENGINE_FLY.z,0);
    for(let i=0;i<12;i++){const q=a+i*Math.PI/6;put(DY,0,Math.sin(q)*1.05,Math.cos(q)*1.05,0.18,0.24,0.24,K.dark);}
    for(let i=0;i<3;i++){const q=a+i*Math.PI*2/3;for(const r of [0.35,0.7])put(DY,0,Math.sin(q)*r,Math.cos(q)*r,0.12,0.14,0.14,K.ironD);}
    put(DY,0,0,0,0.25,0.25,0.25,K.dark);put(DY,0.6,-0.6+Math.sin(a)*0.25,1.0+Math.cos(a)*0.3,0.8,0.1,0.1,col('#b08a3c'));
    puffs(ENGINE.x+1.75,ENGINE.chimneyTop,ENGINE.z+0.25,16,5.5,1.5,0.45,2.3,SMOKE,SMOKE2,t,99,0.55);
    puffs(ENGINE.x-1.5,2.2,ENGINE.z,5,1.4,1.4,0.15,0.6,STEAM,STEAM,t,98,0.3);}
  for(let i=0;i<chimneys.length;i+=9){const c=chimneys[i];puffs(c[0],c[1],c[2],5,4,0.8,0.2,0.9,col('#9a948c'),col('#c8c2b8'),t,i,0.4);}
  // boats on the Seine
  {const bx=-70+frac(t/44+0.36)*140;const b=boatPos(bx,0.4);drawBoat(b.x,b.z,b.yaw,t,0);
    const fw=toW(0,-1.9,0.9);
    for(let i=0;i<12;i++){const a=frac(t/3.6+i/12)*3.6;const bb=boatPos(bx-a*3.18,0.4);const k=a/3.6;let sz=(0.25+0.7*Math.sqrt(k))*Math.min(1,k*12);if(k>0.75)sz*=(1-k)/0.25;
      frame(bb.x+(fw[0]-b.x)+a*0.2,fw[1]+a*0.9,bb.z+(fw[2]-b.z)-a*0.2,hash(i,Math.floor(t/3.6+i/12))*6);put(SM,0,0,0,sz,sz,sz,{r:lerp(SMOKE.r,SMOKE2.r,k),g:lerp(SMOKE.g,SMOKE2.g,k),b:lerp(SMOKE.b,SMOKE2.b,k)});}
    for(let i=1;i<14;i++){const a=i*0.22;const bb=boatPos(bx-a*3.18,0.4);frame(bb.x,-3.98,bb.z,bb.yaw);const sp=0.4+i*0.09;
      put(DY,sp,0,-2.3,0.28,0.06,0.28,K.water);put(DY,-sp,0,-2.3,0.28,0.06,0.28,K.water);}
    const gx=58-frac(t/70+0.1)*116;const g=boatPos(gx,-3.2);drawBoat(g.x,g.z,g.yaw+Math.PI,t,1);
    for(let i=0;i<3;i++){const L=people[i].L;frame(g.x,0,g.z,g.yaw+Math.PI);const w=toW(0,-3.75,2.3-i*0.4);if(i===0)drawPerson(w[0],w[1],w[2],g.yaw+Math.PI,L,null,0);}}
  // waterfalls off the island edge
  for(const [ex,s] of waterfalls){const z0=zr(ex);for(let i=0;i<90;i++){const life=2.4,a=frac(t/life+hash(i,s,3))*life;const off=(hash(i,s,4)-0.5)*11;
    const y=-4.3-4.9*a*a,sz=0.55+a*0.5;frame(ex+s*(0.6+a*1.6),y,z0+off,0);put(DY,0,0,0,sz,sz*1.6,sz,i%3?col('#9cc6d4'):K.water);}}
  // pigeons
  for(const b of birds){const a=b.ph+t*b.w;const x=Math.cos(a)*b.r,z=TZ+Math.sin(a)*b.r,y=b.h+Math.sin(t*0.8+b.bob)*1.5;
    const yaw=Math.atan2(-Math.sin(a)*Math.sign(b.w),Math.cos(a)*Math.sign(b.w));frame(x,y,z,yaw);const fl=Math.sin(t*15+b.fl);
    put(DY,0,0,0,0.2,0.15,0.36,K.pig);put(DY,0,0.06,0.22,0.12,0.12,0.12,K.pig2);
    put(DY,-0.24,0.04+fl*0.1,0,0.3,0.04,0.18,K.pig);put(DY,0.24,0.04+fl*0.1,0,0.3,0.04,0.18,K.pig);}
  // clouds drifting below and behind the island
  for(const c of clouds){const x=((c.x+t*0.9+170)%340)-170;for(const [bx,by,bz,s] of c.boxes){frame(x+bx,c.y+by,c.z+bz,0);put(SM,0,0,0,s,s*0.6,s,K.white);}}
  for(const D of [DY,SM,GL]){D.m.count=D.n;D.m.instanceMatrix.needsUpdate=true;D.m.instanceColor.needsUpdate=true;}
  // camera: ~25 degree orbit with a gentle push-in toward the tower
  const u=Math.min(Math.max(t/DURATION,0),1),e=0.5*u+0.5*u*u*(3-2*u);
  const az=THREE.MathUtils.degToRad(-12.5+25*e), el=THREE.MathUtils.degToRad(25.5-4.5*e), dist=lerp(238,185,e);
  const tgt=new THREE.Vector3(0,lerp(5,17,e),lerp(2,-3,e));
  camera.position.set(tgt.x+dist*Math.sin(az)*Math.cos(el),tgt.y+dist*Math.sin(el),tgt.z+dist*Math.cos(az)*Math.cos(el));
  camera.lookAt(tgt);
}

// ---------------------------------------------------------------- post-processing
const rt=new THREE.WebGLRenderTarget(W,H,{type:THREE.HalfFloatType,samples:4});
const composer=new EffectComposer(renderer,rt);composer.setPixelRatio(1);composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const gtao=new GTAOPass(scene,camera,W,H);
gtao.updateGtaoMaterial({radius:1.4,distanceExponent:1.4,thickness:1.0,scale:1.0,samples:16,distanceFallOff:1.0});
gtao.updatePdMaterial({lumaPhi:10,depthPhi:2,normalPhi:3,radius:5,radiusExponent:1,rings:2,samples:16});
gtao.blendIntensity=0.95;
composer.addPass(gtao);
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),0.65,0.45,1.6);composer.addPass(bloom);
composer.addPass(new OutputPass());

function renderAt(t){t=Math.min(Math.max(+t||0,0),DURATION);update(t);composer.render();return {t,frame:Math.round(t*FPS),static:STATIC_COUNT,dynamic:DY.n,smoke:SM.n,glow:GL.n};}
let manual=false;
window.renderAt=t=>{manual=true;return renderAt(t);};
window.DURATION=DURATION;window.FPS=FPS;
renderAt(0);
window.ready=true;
const t0=performance.now();
(function loop(){if(manual)return;renderAt(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();
</script>
